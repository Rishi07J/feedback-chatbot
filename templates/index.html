<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>🧠 Feedback Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>


<div class="chat-container">
    <div class="header">
        <h1>Feedback-Driven Chatbot</h1>
        <button id="clear-memory-btn" title="Clear training memory"> Clear Memory</button>
    </div>

    <div id="chat-box">
        <!-- Chat messages will be injected here dynamically -->
    </div>

    <form id="chat-form" class="input-form">
        <input type="text" id="prompt-input" placeholder="Type your message..." required />
        <button type="submit">Send</button>
    </form>
</div>

<!-- Feedback Comment Modal -->
<div id="feedback-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close" title="Close">&times;</span>
        <h3>💬 Add an optional comment</h3>
        <textarea id="feedback-comment" placeholder="Your comment..."></textarea>
        <button id="submit-feedback-btn">Submit Feedback</button>
    </div>
</div>

</body>
</html>
